name: Publish portable Windows release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test and package both architectures
        shell: pwsh
        run: |
          ./scripts/Publish.ps1 -Runtime win-arm64
          ./scripts/Publish.ps1 -Runtime win-x64
      - name: Verify real Windows telemetry and desktop startup
        shell: pwsh
        run: |
          $exe = Resolve-Path artifacts/ARMpulse-win-x64/ARMpulse.exe
          $result = Join-Path $PWD 'artifacts/windows-smoke.json'
          $app = Start-Process $exe -ArgumentList @('--smoke-test', $result) -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw "Native smoke test failed: $($app.ExitCode)" }
          $evidence = Get-Content $result -Raw | ConvertFrom-Json
          if (!$evidence.passed) { throw 'Missing passing native evidence.' }
          ./scripts/Test-Ui.ps1 -Executable $exe -Output artifacts/ui-smoke
      - name: Publish preview downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          gh release create $env:RELEASE_TAG --repo $env:RELEASE_REPO --verify-tag `
            --title "ARMpulse $env:RELEASE_TAG — Windows preview" --prerelease `
            --notes-file docs/RELEASE_NOTES.md `
            artifacts/ARMpulse-win-arm64.zip artifacts/ARMpulse-win-arm64.zip.sha256 `
            artifacts/ARMpulse-win-x64.zip artifacts/ARMpulse-win-x64.zip.sha256 `
            artifacts/ui-smoke/overview.png artifacts/windows-smoke.json
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
      - name: Mark the broken first preview as superseded
        if: github.ref_name == 'v0.1.2'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          gh release edit v0.1.0 --repo $env:RELEASE_REPO `
            --title 'ARMpulse v0.1.0 — superseded (startup bug)' `
            --notes-file docs/SUPERSEDED_0.1.0.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not mark the old preview as superseded.' }
          gh release edit v0.1.1 --repo $env:RELEASE_REPO `
            --title 'ARMpulse v0.1.1 — superseded (sampling bug)' `
            --notes-file docs/SUPERSEDED_0.1.0.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not mark the old preview as superseded.' }
